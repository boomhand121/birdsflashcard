.note p,.info>div p{white-space:pre-line}</style><header><b>❧　雀鳥手記</b><button id="manage">＋ 作者工具</button></header><main><section class="intro"><span class="label">HONG KONG BIRD FIELD GUIDE</span><h1>香港塱原雀鳥觀察手記</h1><p style="white-space:pre-wrap">看相片、聽鳥名，從細微特徵認識身邊的雀鳥。      網頁設計及相片來源：LEUNG CHUN PONG   </p></section><div class="tabs"><button id="learn">▤　雀鳥圖卡</button><button id="quiz">⌕　局部特徵挑戰</button></div><article class="card"><div class="photo"><img id="pic"><span class="tag" id="tag"></span></div><div class="info"><span class="label" id="field"></span><div id="content"></div><div role="status" id="msg"></div></div></article><div class="turn"><button id="prev">← 上一張</button><span class="count" id="count"></span><button id="next" class="next">下一張 →</button></div><section id="library"><h2>雀鳥圖鑑</h2><div class="row" id="row"></div></section></main><footer>香港塱原雀鳥觀察手記　·　<a href="data:text/plain;charset=utf-8,%E9%9B%80%E9%B3%A5%E7%9B%B8%E7%89%87%E4%BE%86%E6%BA%90%E8%88%87%E6%8E%88%E6%AC%8A%0A%E5%8E%9F%E5%9C%96%E7%94%A8%E6%96%BC%E5%85%A8%E7%9B%B8%E5%B1%95%E7%A4%BA%E5%8F%8A%E5%B1%80%E9%83%A8%E6%94%BE%E5%A4%A7%E8%A7%80%E5%AF%9F%E3%80%82%0A%0A%E7%B4%85%E8%80%B3%E9%B5%AF%20%7C%20j%20g%20%7C%20CC%20BY%202.0%20%7C%20https%3A//creativecommons.org/licenses/by/2.0/%0Ahttps%3A//commons.wikimedia.org/wiki/File%3APycnonotus_jocosus_-Kowloon_City-8.jpg%0A%0A%E9%BA%BB%E9%9B%80%20%7C%20Laitche%20%7C%20Public%20domain%0Ahttps%3A//commons.wikimedia.org/wiki/File%3ATree_Sparrow_August_2007_Osaka_Japan.jpg%0A%0A%E9%B5%B2%E9%B4%9D%20%7C%20Charles%20J.%20Sharp%2C%20Sharp%20Photography%20%7C%20CC%20BY-SA%204.0%20%7C%20https%3A//creativecommons.org/licenses/by-sa/4.0/%0Ahttps%3A//commons.wikimedia.org/wiki/File%3AOriental_magpie-robin_%2528Copsychus_saularis_ceylonensis%2529_male.jpg%0A%0A%E7%99%BD%E9%A0%AD%E9%B5%AF%20%7C%20CharlesLam%20%7C%20CC%20BY-SA%202.0%20%7C%20https%3A//creativecommons.org/licenses/by-sa/2.0/%0Ahttps%3A//commons.wikimedia.org/wiki/File%3ALight-vented_Bulbul2.jpg" download <script>
const $=id=>document.getElementById(id),base=JSON.parse($('seed').textContent),key='hk-field-guide-'+(document.getElementById('seed').dataset.storage||base.length);let extra=[];try{extra=JSON.parse(localStorage.getItem(key)||'[]')}catch{}let birds=base.concat(extra),i=0,test=false,done=false;
