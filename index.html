*{box-sizing:border-box}body{margin:0;background:#f6f4eb;color:#243f30;font:16px "PingFang HK","Microsoft JhengHei",sans-serif}header,main,footer{max-width:1160px;margin:auto;padding:0 5%}header{display:flex;justify-content:space-between;align-items:center;height:78px;border-bottom:1px solid #bdc1ac}header b{font: bold 21px Georgia,serif;letter-spacing:.04em}button,a{cursor:pointer}button{background:#fffef6;border:1px solid #aeb8a3;color:inherit;padding:11px 17px;border-radius:5px;font:inherit}button:hover{background:#e6eadc}.intro{margin:42px 0 26px}.label{font:700 11px monospace;letter-spacing:.16em;color:#607756}h1{font:700 clamp(34px,6vw,62px) serif;letter-spacing:.04em;margin:9px 0}.intro p{margin:0;color:#62705f}.tabs{display:flex;gap:6px;margin-bottom:18px}.active,.next{background:#284c36!important;color:white}.card{display:grid;grid-template-columns:57% 43%;border:1px solid #adb69e;border-radius:9px;overflow:hidden;background:#fffdf4}.photo{position:relative;background:#d6dfc7;min-height:400px;overflow:hidden}.photo img{width:100%;height:100%;position:absolute;object-fit:cover;transition:transform .4s}.tag{position:absolute;bottom:15px;left:16px;background:#fbfaee;padding:6px 11px;font:12px monospace;letter-spacing:.08em}.info{padding:clamp(20px,4vw,48px);align-self:center}.info h2{font: bold 40px serif;margin:21px 0 4px}.eng{font:italic 21px Georgia,serif;color:#61705b}.sound{display:flex;gap:8px;margin:20px 0}.sound button{font-size:14px}.note{border-top:1px solid #c9cebd;padding-top:16px}.turn{display:flex;justify-content:space-between;align-items:center;margin:18px 0 36px}.count{font:15px monospace}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.mini{text-align:left;padding:0;overflow:hidden}.mini img{width:100%;height:105px;object-fit:cover;display:block}.mini b{display:block;padding:10px}footer{margin:30px auto;color:#65705e;font-size:12px}dialog{border:1px solid #86967d;border-radius:9px;background:#fffdf4;color:inherit;width:min(440px,94vw)}input{width:100%;padding:9px;margin:4px 0 13px}dialog::backdrop{background:#172c2088}.options button{margin:4px}.selected{outline:2px solid #53704c}a{color:inherit}@media(max-width:680px){header{height:64px}.intro{margin:25px 0}.card{display:block}.photo{min-height:250px}.info{padding:20px}.info h2{margin-top:10px}.row{grid-template-columns:1fr 1fr}}
.note p,.info>div p{white-space:pre-line}</style><header><b>❧　雀鳥手記</b><button id="manage">＋ 作者工具</button></header><main><section class="intro"><span class="label">HONG KONG BIRD FIELD GUIDE</span><h1>香港雀鳥觀察手記</h1><p>看相片、聽鳥名，從細微特徵認識身邊的雀鳥。</p></section><div class="tabs"><button id="learn">▤　雀鳥圖卡</button><button id="quiz">⌕　局部特徵挑戰</button></div><article class="card"><div class="photo"><img id="pic"><span class="tag" id="tag"></span></div><div class="info"><span class="label" id="field"></span><div id="content"></div><div role="status" id="msg"></div></div></article><div class="turn"><button id="prev">← 上一張</button><span class="count" id="count"></span><button id="next" class="next">下一張 →</button></div><section id="library"><h2>雀鳥圖鑑</h2><div class="row" id="row"></div></section></main><footer>香港雀鳥觀察手記　·　<a href="data:text/plain;charset=utf-8,%E9%9B%80%E9%B3%A5%E7%9B%B8%E7%89%87%E4%BE%86%E6%BA%90%E8%88%87%E6%8E%88%E6%AC%8A%0A%E5%8E%9F%E5%9C%96%E7%94%A8%E6%96%BC%E5%85%A8%E7%9B%B8%E5%B1%95%E7%A4%BA%E5%8F%8A%E5%B1%80%E9%83%A8%E6%94%BE%E5%A4%A7%E8%A7%80%E5%AF%9F%E3%80%82%0A%0A%E7%B4%85%E8%80%B3%E9%B5%AF%20%7C%20j%20g%20%7C%20CC%20BY%202.0%20%7C%20https%3A//creativecommons.org/licenses/by/2.0/%0Ahttps%3A//commons.wikimedia.org/wiki/File%3APycnonotus_jocosus_-Kowloon_City-8.jpg%0A%0A%E9%BA%BB%E9%9B%80%20%7C%20Laitche%20%7C%20Public%20domain%0Ahttps%3A//commons.wikimedia.org/wiki/File%3ATree_Sparrow_August_2007_Osaka_Japan.jpg%0A%0A%E9%B5%B2%E9%B4%9D%20%7C%20Charles%20J.%20Sharp%2C%20Sharp%20Photography%20%7C%20CC%20BY-SA%204.0%20%7C%20https%3A//creativecommons.org/licenses/by-sa/4.0/%0Ahttps%3A//commons.wikimedia.org/wiki/File%3AOriental_magpie-robin_%2528Copsychus_saularis_ceylonensis%2529_male.jpg%0A%0A%E7%99%BD%E9%A0%AD%E9%B5%AF%20%7C%20CharlesLam%20%7C%20CC%20BY-SA%202.0%20%7C%20https%3A//creativecommons.org/licenses/by-sa/2.0/%0Ahttps%3A//commons.wikimedia.org/wiki/File%3ALight-vented_Bulbul2.jpg" download="相片來源.txt">相片來源</a></footer>
<dialog id="dlg"><form id="form"><h2>作者工具</h2><p>新增圖卡會儲存在此瀏覽器。下載遊戲可將整套圖卡交給學生。</p><label>中文名稱<input id="cn" required maxlength="60"></label><label>英文名稱<input id="en" required maxlength="100"></label><label>辨認特徵<input id="hint" maxlength="200"></label><label>雀鳥相片<input id="file" type="file" accept="image/*" required></label><button class="next">加入圖卡</button> <button type="button" id="download">下載整套遊戲</button> <button type="button" onclick="dlg.close()">關閉</button><p id="status" role="status"></p></form></dialog>
<script id="seed" data-storage="4" type="application/json">[["紅耳鵯", "Red-whiskered Bulbul", "留意高聳的黑色冠羽，以及臉頰上的紅色斑塊。", "1.jpg"], ["麻雀", "Eurasian Tree Sparrow", "頭頂栗褐色，白色臉頰上各有一塊黑斑。", "2.jpg"], ["鵲鴝", "Oriental Magpie-Robin", "翅膀有白斑，經常豎起長尾巴。", "3.jpg"], ["白頭鵯", "Light-vented Bulbul", "後頭有明顯白斑，背部帶橄欖綠色。", "4.jpg"], ["黃胸鵐", "Yellow-breasted Bunting", "成年雄鳥具黑色面容與喉部、鮮黃色腹部、栗色的胸帶及赤褐色的頭頂／頸背；雌鳥則有寬闊的淡黃白色眉紋。", "5.jpg"], ["黑喉石䳭", "Siberian Stonechat", "雄鳥：頭部黑色，具有明顯的黑色喉部、白色的頸側及腰部，胸部呈銹紅色或黃褐色，腹部偏白。\n雌鳥與非繁殖期：上體大致呈淡褐或黑褐色有斑紋，下體較淡，臉部缺乏雄鳥鮮明的黑白對比。", "DSC_2992.jpg"], ["珠頸斑鳩", "Spotted Dove", "頸側和後頸帶有明顯的黑底白點，狀似珍珠項鍊。身形略小於一般鴿子，常在市區公園或郊外地面覓食。", "珠頸斑鳩.jpeg"], ["池鷺", "Chinese Pond Heron", "體型中等偏小，體長約 40 至 65 厘米，常見約 45 至 46 厘米。嘴部黃色，尖端黑色。", "DSC_9024.jpg"], ["白鶺鴒", "White Wagtail", "體長約 16 至 21 厘米，羽毛主要呈黑、白、灰三色。雄鳥夏羽黑白分明，冬季或雌鳥的羽色較多灰色。", "白鶺鴒.jpg"], ["反嘴鷸", "Pied Avocet", "體長約 44 厘米。成鳥以黑白兩色為主，黑色的嘴細長而向上彎。飛行時，翼上和背部的黑色色斑十分獨特。", "反嘴鷸.jpg"], ["扇尾沙錐", "Common Snipe", "體長約 27 厘米。嘴長，上體偏褐色，背上有黃色粗縱紋。飛行時可見次級飛羽顯眼的白色後緣。", "扇尾沙錐.jpg"]]</script>
<script>
const $=id=>document.getElementById(id),base=JSON.parse($('seed').textContent),key='hk-field-guide-'+(document.getElementById('seed').dataset.storage||base.length);let extra=[];try{extra=JSON.parse(localStorage.getItem(key)||'[]')}catch{}let birds=base.concat(extra),i=0,test=false,done=false;
function btn(t,f,p){let b=document.createElement('button');b.textContent=t;b.onclick=f;p.append(b);return b}
function say(eng){let s=window.speechSynthesis;if(!s){msg.textContent='此瀏覽器未支援語音播放。';return}let lang=eng?'en-GB':'zh-HK',voices=s.getVoices(),v=voices.find(x=>eng?/^en/i.test(x.lang):/zh[-_]HK|yue|cantonese/i.test(x.lang+' '+x.name));if(!eng&&voices.length&&!v){msg.textContent='請在裝置語音設定加入香港粵語聲線。';return}let u=new SpeechSynthesisUtterance(birds[i][eng?1:0]);u.lang=lang;if(v)u.voice=v;u.rate=.85;u.onerror=()=>msg.textContent='未能播放，請檢查裝置語音設定。';s.cancel();s.speak(u)}
function render(){let d=birds[i],hidden=test&&!done,c=$('content');c.replaceChildren();msg.textContent='';pic.src=d[3];pic.alt=hidden?'待辨認的局部雀鳥相片':d[0];pic.style.objectFit=hidden?'cover':'contain';pic.style.transformOrigin=(['29% 40%','63% 22%','47% 56%','60% 25%','53% 32%','52% 31%','20% 38%','32% 29%','51% 35%','38% 39%','42% 42%'][i]||'50% 50%');pic.style.objectPosition=hidden?pic.style.transformOrigin:'center';pic.style.transform=hidden?'scale(2.3)':'none';tag.textContent='PLATE '+String(i+1).padStart(2,'0');field.textContent=hidden?'DETAIL CHALLENGE':'SPECIES FIELD CARD';learn.classList.toggle('active',!test);quiz.classList.toggle('active',test);library.hidden=test;count.textContent=(i+1)+' / '+birds.length;let h=document.createElement('h2');h.textContent=hidden?'這是哪種雀鳥？':d[0];c.append(h);if(hidden){let p=document.createElement('p');p.textContent=d[2]||'細看羽色和形態，再選出鳥名。';c.append(p);let o=document.createElement('div');o.className='options';c.append(o);let opts=birds.filter(x=>x!==d).sort(()=>Math.random()-.5).slice(0,3).concat([d]).sort(()=>Math.random()-.5);opts.forEach(x=>{let b=btn(x[0],()=>{if(x===d){done=true;render();msg.textContent='答對了！'}else{b.disabled=true;msg.textContent='再看看相片上的特徵，試選另一個答案。'}},o)});}else{let e=document.createElement('div');e.className='eng';e.textContent=d[1];c.append(e);let s=document.createElement('div');s.className='sound';c.append(s);btn('◖)) 廣東話',()=>say(false),s);btn('◖)) English',()=>say(true),s);let n=document.createElement('div');n.className='note';n.innerHTML='<b>辨認特徵</b>';let p=document.createElement('p');p.textContent=d[2]||'觀察頭部、翅膀和尾羽的顏色。';n.append(p);c.append(n)}row.replaceChildren();birds.forEach((x,j)=>{let b=btn('',()=>{i=j;render();document.querySelector('.tabs').scrollIntoView()},row);b.className='mini'+(j===i?' selected':'');let img=new Image();img.src=x[3];img.alt='';let name=document.createElement('b');name.textContent=x[0];b.append(img,name)})}
function move(n){i=(i+n+birds.length)%birds.length;done=false;render()}prev.onclick=()=>move(-1);next.onclick=()=>move(1);learn.onclick=()=>{test=false;render()};quiz.onclick=()=>{test=true;i=Math.floor(Math.random()*birds.length);done=false;render()};manage.onclick=()=>dlg.showModal();
function encode(img){let a=document.createElement('canvas'),k=Math.min(1,1200/Math.max(img.naturalWidth,img.naturalHeight));a.width=Math.max(1,img.naturalWidth*k);a.height=Math.max(1,img.naturalHeight*k);a.getContext('2d').drawImage(img,0,0,a.width,a.height);return a.toDataURL('image/jpeg',.86)}
form.onsubmit=async e=>{e.preventDefault();let url=URL.createObjectURL(file.files[0]);try{let img=new Image();img.src=url;await img.decode();let d=[cn.value.trim(),en.value.trim(),hint.value.trim(),encode(img)];if(!d[0]||!d[1])throw Error();let arr=extra.concat([d]);localStorage.setItem(key,JSON.stringify(arr));extra=arr;birds=base.concat(extra);i=birds.length-1;test=false;form.reset();dlg.close();render()}catch{$('status').textContent='無法儲存，請檢查名稱、圖片格式及瀏覽器儲存空間。'}finally{URL.revokeObjectURL(url)}};
download.onclick=async()=>{try{let data=await Promise.all(birds.map(async d=>{let img=new Image();img.src=d[3];await img.decode();return [...d.slice(0,3),encode(img)]}));let doc=document.documentElement.cloneNode(true);doc.querySelector('#seed').removeAttribute('data-storage');doc.querySelector('#seed').textContent=JSON.stringify(data).replace(/</g,'\\u003c');doc.querySelector('dialog').removeAttribute('open');doc.querySelector('#row').replaceChildren();doc.querySelector('#pic').removeAttribute('src');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['<!doctype html>'+doc.outerHTML],{type:'text/html'}));a.download='香港雀鳥觀察手記.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}catch{$('status').textContent='無法匯出，請使用已內嵌相片的遊戲檔。'}};window.speechSynthesis?.getVoices();render()
</script></html>
